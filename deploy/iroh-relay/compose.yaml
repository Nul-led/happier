services:
  iroh-relay:
    # Upstream 1.1.0 cannot currently start QAD with forwarding disabled; keep
    # this candidate out of every default Compose deployment until that exact
    # runtime gate passes with a replacement pinned release.
    profiles:
      - lane06-relay-gate-blocked
    image: happier/iroh-relay:holepunch-only
    build:
      context: .
    read_only: true
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "7842:7842/udp"
    volumes:
      - ./relay.toml:/etc/iroh/relay.toml:ro
      - ./certs:/etc/iroh/certs:ro
    # The relay profile is intentionally stateless: no database, key, or
    # application-server volume is mounted. Runtime scratch is memory-only.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
