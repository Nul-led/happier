plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'dev.happier.iroh'
version = '0.0.0'

def happierIrohNativeAndroidApiLevel = 24

android {
  namespace "dev.happier.iroh"
  defaultConfig {
    minSdk happierIrohNativeAndroidApiLevel
    versionCode 1
    versionName version
    ndk {
      abiFilters 'arm64-v8a', 'x86_64'
    }
  }
  sourceSets {
    main { jniLibs.srcDirs += ["${buildDir}/generated/rustJniLibs"] }
  }
}

tasks.register("buildHappierIrohRustAndroid", Exec) {
  workingDir projectDir.parentFile
  environment "HAPPIER_ANDROID_NATIVE_API_LEVEL", (System.getenv("HAPPIER_ANDROID_NATIVE_API_LEVEL") ?: happierIrohNativeAndroidApiLevel.toString())
  commandLine "bash", "scripts/build-rust-android.sh"
}

preBuild.dependsOn(tasks.named("buildHappierIrohRustAndroid"))
