[package]
name = "happier-iroh-native"
version = "0.0.0"
edition = "2021"
license = "MIT"

[lib]
name = "happier_iroh_native"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
test-relay-fixture = ["happier-iroh-core/test-relay-fixture"]

[dependencies]
happier-iroh-core = { path = "../happier-iroh-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
zeroize = "1.9"
tokio = { version = "1", default-features = false, features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
