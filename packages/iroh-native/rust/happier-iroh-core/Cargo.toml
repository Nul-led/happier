[package]
name = "happier-iroh-core"
version = "0.0.0"
edition = "2021"

[lib]
crate-type = ["lib"]

[features]
# Test-only: enables the pinned iroh local relay test facility for the
# forced-relay fixture. Never a release behavior dependency.
test-relay-fixture = ["iroh/test-utils"]

[dependencies]
# Keep the native transport and relay protocol on one audited release line.
iroh = "=1.1.0"
getrandom = "=0.3.3"
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
zeroize = { version = "1.9", features = ["zeroize_derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
] }
