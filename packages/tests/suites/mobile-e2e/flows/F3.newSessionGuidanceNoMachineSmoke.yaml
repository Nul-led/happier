appId: ${HAPPIER_E2E_MOBILE_APP_ID}
---
- launchApp:
    clearState: true
    clearKeychain: true

- runFlow:
    file: _shared/connectDevClientIfNeeded.yaml

- runFlow:
    file: _shared/configureServerIfNeeded.yaml

- runFlow:
    file: _shared/loginCreateAccount.yaml

- tapOn:
    id: tabbar-start-new-session

- runFlow:
    file: _shared/dismissExpoDevMenuOverlayMaybe.yaml

- extendedWaitUntil:
    visible:
      id: session-getting-started-kind-connect_machine
    timeout: 60000

- assertVisible:
    id: session-getting-started-kind-connect_machine
- assertVisible:
    id: session-getting-started-open-setup
- tapOn:
    id: session-getting-started-open-setup
- extendedWaitUntil:
    visible:
      id: settings.machines.draft.form
    timeout: 60000
- assertVisible:
    id: settings.machines.draft.form
